<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>estudos de Iframe</title>
</head>
<body>
    <h1>Testando uso de um iframe</h1>

    <!-- *por padrão o tamanho do iframe será 300 x 150 -->
    <!-- * A estilização via CSS é SOBERANA para estes iframes -->

    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">CursoemVideo</a> para aprender a programar</p>
    <iFrame src="https://www.cursoemvideo.com" frameborder="0" height="300" width="700"></iFrame>
    <p>Acessando o site da <a href="https://web.dio.me/play" target="_blank">DIO.PRO</a> para aprender a programar</p>

    <iFrame src="https://www.dio.me" frameborder="0" height="400" width="700"></iFrame>

    <p>o repositorio do Guanabara <iframe src="https://gustavoguanabara.github.io"  frameborder="0"></iframe> é muito legal</p>
    
</body>
</html>
