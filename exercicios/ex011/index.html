<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midias em HTML5</title>
  </head>
  <body>
    <h1>Imagens dinâmicas</h1>
    <p>
      Tente abrir este site em vários dispositivos diferentes <br />
      ou simplesmente aumente e diminua o tamanho do seu navegador.
    </p>

    <picture>
      <source
        media="(max-width: 750px )"
        srcset="/html-css/assets/foto-p.png"
        type="image/png"
      />
      <source
        media="(max-width: 1050px )"
        srcset="/html-css/assets/foto-m.png"
        type="image/png"
      />
      <img src="/html-css/assets/foto-g.png" alt="Imagem flexível" />
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio src="/html-css/midia/happy-mistake.mp3" controls></audio>

    <audio preload="metadata" controls loop>
      <source
        src="/html-css/midia/guanacast-33.mp3"
        controls
        type="audio/mpeg"
      />
      <source
        src="/html-css/midia/guanacast-33.ogg"
        controls
        type="audio/ogg"
      />
      <source
        src="/html-css/midia/After_Sunset.wav"
        controls
        type="audio/wav" !-- Arquivo grandes e pesados -->
      />
      <p>
        Infelizmente seu navegador não suporta áudio.
        <a href="/html-css/midia/guanacast-33.mp3"
          >Clique aqui para baixar o arquivo MP3</a
        >
      </p>
    </audio>
  </body>
</html>
