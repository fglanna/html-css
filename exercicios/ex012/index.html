<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>

    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo esta hospedado no meu proprio servidor.</p>

    <video width="500"  poster="/html-css/assets/limoes-capa.png" controls>

        <source src="/html-css/midia/meu-video.ogv" type="video/ogv">
        <source src="/html-css/midia/meu-video.m4v" type="video/m4v">
        <source src="/html-css/midia/meu-video.mp4" type="video/mp4">
        <source src="/html-css/midia/meu-video.webm" type="video/webm">
        <p>Seu navegador não suporta vídeos.</p>

    </video>

    <h1>Inserindo videos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg?si=r6UqUiISPXZXV-m_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
