<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1></h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required
                placeholder="Digite o nome aqui">
            </p>
            <p>
                <label for="iemail">E-mail: </label>
                <input type="email" name="email" id="iemail" autocomplete="email" required
                placeholder="Digite aqui o email">
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" required placeholder="(xx) xxxxx-xxxx" title="Digite um telefone válido com DDD" pattern="^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$">
            </p>
        </fieldset>

        <!-- *Estudar REGEX (expressões regulares)
        *    ^\(?        -> abre parêntese opcional
        *    \d{2}       -> DDD com 2 números
        *    \)?         -> fecha parêntese opcional
        *    \s?         -> espaço opcional
        *    \d{4,5}     -> primeira parte do número (4 ou 5 dígitos)
        *    -?          -> hífen opcional
        *    \d{4}$      -> última parte (4 dígitos) -->

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
