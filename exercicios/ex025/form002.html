<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="POST" autocomplete="off">
      <label for="iusu">Usuário:</label>
      <input type="text" name="usu" id="iusu" required minlength="3" maxlength="15" size="14" placeholder="Digite seu nome aqui">

      <p>
        <label for="isen">Senha:</label>
        <input type="password" name="sen" id="isen" required minlength="5" maxlength="8" size="15" placeholder="Digite sua senha aqui">
      </p>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
